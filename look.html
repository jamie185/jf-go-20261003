<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JF Go · look around</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font:600 14px/1.3 -apple-system,Inter,system-ui,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
  .hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;transition:opacity .6s}
  .got{position:fixed;left:50%;top:16px;transform:translate(-50%,-30px);opacity:0;background:rgba(255,255,255,.94);color:#16181D;padding:10px 16px;border-radius:18px;transition:all .45s cubic-bezier(.32,.72,0,1);pointer-events:none}
  .got.on{transform:translate(-50%,0);opacity:1}
  .cr{position:fixed;right:8px;top:6px;font:500 9px/1.2 -apple-system,Inter,sans-serif;color:rgba(255,255,255,.55)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">Drag to look around</div>
<div class="got" id="got">Collected</div>
<div class="cr" id="cr"></div>
<script type="module">
import { createPhotoScene } from "./js/scene3d.js";
const s = new URLSearchParams(location.search).get("s") || "gym";
const cfg = s === "park"
  ? { img: "img/park-02.jpg", depth: "img/park-02-depth.png", sky: 0.035, hfov: 74, near: 1.5, far: 45, gamma: 1.3, sway: 0.45, margin: 0.04, crop: 0.92,
      targets: [{ id: "far", u: 0.315, v: 0.475, behind: 9, beam: "gold", beamHeight: 30, beamRadius: 0.6 }, { id: "near", u: 0.66, v: 0.66, behind: 0.2, kind: "dumbbell", size: 0.62, lift: 0.5, beam: "gold", beamHeight: 6, beamRadius: 0.18 }],
      start: 0, hint: "Drag to look around. Tap the dumbbell.", cr: "Photo: Philip Mallis, CC BY-SA 2.0. Depth: Depth Anything V2." }
  : { img: "img/gym-chelsea-heights-07.jpg", depth: "img/gym-chelsea-heights-07-depth.png", hfov: 78, near: 1.6, far: 16, gamma: 1.1, sway: 1.1, margin: 0.03, crop: 0.92,
      targets: [{ id: "key", u: 0.637, v: 0.6, behind: 0.9, kind: "key", size: 0.5, lift: 0.45, beam: "gym", beamHeight: 3.2, beamRadius: 0.22 }],
      start: 0.05, hint: "Drag left and right. The key is behind the plate tree.", cr: "Photo: Snap Fitness Chelsea Heights. Depth: Depth Anything V2." };
document.getElementById("hint").textContent = cfg.hint; document.getElementById("cr").textContent = cfg.cr;
const sc = await createPhotoScene(document.getElementById("c"), { ...cfg, onCollect: (t) => { const g = document.getElementById("got"); g.textContent = (s === "park" ? "Golden dumbbell" : "Gym key") + " collected"; g.classList.add("on"); setTimeout(() => g.classList.remove("on"), 2200); } });
sc.look(cfg.start);
/* a gentle idle sway until someone touches it, so the parallax is obvious */
let touched = false, t0 = performance.now();
addEventListener("pointerdown", () => { touched = true; document.getElementById("hint").style.opacity = .0; });
(function idle() { if (touched) return; const t = (performance.now() - t0) / 1000; sc.look(cfg.start + Math.sin(t * 0.5) * 0.28, true); requestAnimationFrame(idle); })();
</script>
</body>
</html>
